<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Main Video icon foreground</title>
  <desc>
    A rounded-triangular ribbon whose opening is the play symbol. The triangle
    is not drawn on top of the orange: a mask punches it through every layer,
    so what shows is the ivory base behind. Vector, so it stays crisp at every
    launcher size; the PNGs under android/app/src/main/res render from here.
  </desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset="0.55" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#F1EEE7"/>
    </linearGradient>

    <linearGradient id="orange" x1="0.12" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F8C25C"/>
      <stop offset="0.22" stop-color="#F6B84A"/>
      <stop offset="0.44" stop-color="#F39A3D"/>
      <stop offset="0.66" stop-color="#E87832"/>
      <stop offset="0.86" stop-color="#D65A29"/>
      <stop offset="1" stop-color="#C84B24"/>
    </linearGradient>

    <linearGradient id="orangeUnder" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E88A42"/>
      <stop offset="0.6" stop-color="#D4642B"/>
      <stop offset="1" stop-color="#C04A23"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0.1" y1="0" x2="0.75" y2="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="baseGlow" cx="0.3" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blurTight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blurWide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <path id="ribbonOuter"
          d="M 223.0 138.8 L 374.0 226.0 Q 426 256 374.0 286.0
             L 223.0 373.2 Q 171 403.2 171 343.2
             L 171 168.8 Q 171 108.8 223.0 138.8 Z"/>
    <path id="ribbonHole"
          d="M 254.8 202.1 L 324.3 242.2 Q 348.2 256 324.3 269.8
             L 254.8 309.7 Q 230.9 323.7 230.9 283.9
             L 230.9 228.1 Q 230.9 188.3 254.8 202.1 Z"/>

    <mask id="punchHole">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <use href="#ribbonHole" fill="#000000"/>
    </mask>

    <clipPath id="clipOuter"><use href="#ribbonOuter"/></clipPath>
    <clipPath id="clipHole"><use href="#ribbonHole"/></clipPath>
    <clipPath id="clipBase">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>
  <g id="iconSymbol" transform="translate(256 256) scale(0.92) translate(-256 -256)">
    <g mask="url(#punchHole)">
      <g transform="translate(0 12)" opacity="0.18" filter="url(#dropSoft)">
        <use href="#ribbonOuter" fill="#8A4A22"/>
      </g>

      <g transform="rotate(-6 256 256) translate(256 256) scale(0.99) translate(-256 -256)"
         opacity="0.26">
        <use href="#ribbonOuter" fill="url(#orangeUnder)"/>
      </g>

      <use href="#ribbonOuter" fill="url(#orange)"/>

      <g clip-path="url(#clipOuter)">
        <use href="#ribbonOuter" fill="url(#sheen)"/>
        <g transform="translate(3.5 4)" filter="url(#blurTight)">
          <use href="#ribbonOuter" fill="none" stroke="#FFFFFF"
               stroke-opacity="0.5" stroke-width="5"/>
        </g>
        <g transform="translate(-5 -6)" filter="url(#blurWide)">
          <use href="#ribbonOuter" fill="none" stroke="#9C3F1C"
               stroke-opacity="0.32" stroke-width="9"/>
        </g>
      </g>
    </g>

    <g clip-path="url(#clipHole)">
      <g filter="url(#blurWide)">
        <use href="#ribbonHole" fill="none" stroke="#A85A2C"
             stroke-opacity="0.22" stroke-width="12"/>
      </g>
      <g transform="translate(2 2.5)" filter="url(#blurTight)">
        <use href="#ribbonHole" fill="none" stroke="#8E4620"
             stroke-opacity="0.13" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>
